# Mull mutation testing configuration
# https://mull.readthedocs.io/en/latest/Configuration.html

# Runner-side only: the frontend that embeds mutants at compile time never sees
# this file (MULL_CONFIG is exported only around mull-runner), so this list can
# narrow what is run but never add a family.  The embedded set is arithmetic and
# comparison; no logical mutants exist in the binaries whatever is listed here.
mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_logical

timeout: 60000  # 60 seconds per mutant — keeps audio-thread tests (WAV decoder
                # loop in WPSoundParser) and compute-heavy ops (PassCacheAlias)
                # from bucketing as spurious Timeout instead of measuring kill
                # rate.  Default 10s buckets ~40 of those incorrectly.

excludePaths:
  - .*/third_party/.*
  - .*/src/Test/.*
  - .*/nlohmann/.*
  - .*/Eigen/.*
  - .*/doctest/.*
