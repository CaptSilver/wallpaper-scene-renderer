# Mull mutation testing configuration
# https://mull.readthedocs.io/en/latest/Configuration.html

# Read twice.  The frontend that embeds mutants into object code reads it at
# compile time (cmake/WekMullInstrument.cmake gives every instrumented target
# MULL_CONFIG pointing here) and decides which mutants exist; mull-runner reads
# it again through MULL_CONFIG and can only run fewer.  cxx_default is Mull's
# own default set (increment, arithmetic, comparison, boundary) and is what the
# baseline was first measured with; bitwise and logical are on top so that
# bit-twiddling code like TripleSwapchain's tagged pointers is measured at all.
mutators:
  - cxx_default
  - cxx_bitwise
  - cxx_logical

timeout: 60000  # 60 seconds per mutant — keeps audio-thread tests (WAV decoder
                # loop in WPSoundParser) and compute-heavy ops (PassCacheAlias)
                # from bucketing as spurious Timeout instead of measuring kill
                # rate.  Default 10s buckets ~40 of those incorrectly.

excludePaths:
  - .*/third_party/.*
  - .*/src/Test/.*
  - .*/nlohmann/.*
  - .*/Eigen/.*
  - .*/doctest/.*
